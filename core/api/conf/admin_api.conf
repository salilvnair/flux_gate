location /api/admin/saveConfigFile {
    include /usr/local/openresty/lualib/flux_gate/core/api/conf/base_api.conf;
    access_by_lua_block {
        local webSecurityConfig = require("flux_gate/core/security/web_security_config")
        webSecurityConfig.config()
    }
    content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/admin/config_file_provider.lua;
}

location ~ ^/api/admin/nginx/(updateUpstream|updateNameResolver)$ {
    include /usr/local/openresty/lualib/flux_gate/core/api/conf/base_api.conf;
    access_by_lua_block {
        local webSecurityConfig = require("flux_gate/core/security/web_security_config")
        webSecurityConfig.config()
    }
    content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/admin/nginx_file_provider.lua;
}