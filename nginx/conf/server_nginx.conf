
# user  nobody;
worker_processes  auto;

error_log  logs/flux_gate.log  debug;

events {
    worker_connections  1024;
}


http {

    include       mime.types;
    default_type  application/octet-stream;

    include /usr/local/openresty/lualib/flux_gate/nginx/conf/fluxgate_resolver.conf;
    resolver_timeout 5s;
    include /usr/local/openresty/lualib/flux_gate/nginx/conf/fluxgate_upstreams.conf;
    

    # lua_package_path "/usr/local/share/lua/5.1/?.lua;;";
    # lua_package_cpath "/usr/local/lib/lua/5.1/?.so;;";

    lua_package_path "/Users/salilvnair/.luarocks/share/lua/5.1/?.lua;/Users/salilvnair/.luarocks/share/lua/5.1/?/init.lua;;";
    lua_package_cpath "/Users/salilvnair/.luarocks/lib/lua/5.1/?.so;;";

    lua_shared_dict fluxgate_shared_dict 1m;

    init_worker_by_lua_block {
        local memoryUtils = require("flux_gate/core/utils/memory_utils")
        memoryUtils.log()
    }

    exit_worker_by_lua_block {
        local Database = require("flux_gate/core/db/db")
        Database:close_all()
    }

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    #Console UI config and apis
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /usr/local/openresty/ssl/cert.pem;
        ssl_certificate_key /usr/local/openresty/ssl/cert.key;
           
        ssl_session_cache    shared:SSL:15m;
        ssl_session_timeout  50m;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        server_name localhost;

        location /config {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/config_provider.lua;
        }

        location ~ ^/auth/(authorize|redirect)$ {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/auth/provider/auth_provider.lua;
        }

        location /saveConfigFile {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/config_file_provider.lua;
        }

        location ~ ^/nginx/(updateUpstream|updateNameResolver)$ {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/nginx_file_provider.lua;
        }

        location /initConfig {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/init_config_file_provider.lua;
        }

        location /configModule {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/config_module_provider.lua;
        }

        location /availableResolvers {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/available_resolver_provider.lua;
        }

        location /operators {
            # Add CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            content_by_lua_file /usr/local/openresty/lualib/flux_gate/core/api/operator_provider.lua;
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|jpg|png|gif|webp)$ {
            root /usr/local/openresty/lualib/flux_gate/console;
            add_header Content-Type application/javascript;  # Only applies to .js
            try_files $uri =404;
        }

        location / {
            content_by_lua_block {
                local consoleUtils = require("flux_gate/core/utils/console_utils")                
                local base_url = ngx.var.scheme .. "://" .. ngx.var.host
                consoleUtils.initIndexHtml(base_url)
            }
        }

        location /index.html {
            root /usr/local/openresty/lualib/flux_gate/console;
            index index.html;
        }
        
    }


    # test server to test gating resolved url
    server {
        listen 9099;
        server_name localhost;

        location ~ ^/(.+)$ {
            content_by_lua_block { 
                local json = require("cjson")
                ngx.header.content_type = "application/json; charset=utf-8"
                ngx.status = ngx.HTTP_OK
                local gate = require("flux_gate/core/gate")
                local newUrl = gate.resolveUrl(ngx)
                local json_string = json.encode({ resolvedUrl = newUrl })
                json_string = string.gsub(json_string, "\\/", "/")
                ngx.say(json_string)
            }
        }
    }

    # Rest Servers using proxy_pass
    server {
        listen 30100;
        listen 30200;
        server_name localhost;

        location ~ ^/(.+)$ {
            set $target_url "";
            access_by_lua_block {
                local restEbdPointService = require("flux_gate/core/service/rest_endpoints_service")
                restEbdPointService.register()
            }

            proxy_pass http://$target_url;


            proxy_set_header Host $host;
            proxy_pass_header Connection;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Add others if needed
            proxy_pass_request_headers on;


            # proxy_set_header X-Original-URI $request_uri;
            # proxy_set_header User-Agent $http_user_agent;
            # proxy_set_header Accept $http_accept;
            # proxy_set_header Accept-Encoding $http_accept_encoding;
            # proxy_set_header Accept-Language $http_accept_language;
            # proxy_set_header Referer $http_referer;
            # proxy_set_header Authorization $http_authorization;

            # # Optional headers
            # proxy_set_header X-Forwarded-Host $host;
            # proxy_set_header X-Forwarded-Port $server_port;
            # proxy_set_header Cookie $http_cookie;

            log_by_lua_block {
                local logger = require("flux_gate/core/utils/logger")
                logger.debug("Upstream used: ".. ngx.var.upstream_addr)
                logger.debug("Upstream response time: ".. ngx.var.upstream_response_time)
                logger.debug("Upstream status: ".. ngx.var.upstream_status)
            }
        }
    }

    # # SAOP Servers
    # server {
